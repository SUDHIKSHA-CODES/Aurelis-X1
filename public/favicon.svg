<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <rect width="100" height="100" rx="24" fill="#0A0A0C"/>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A6D1C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Geometric Aurelis Monogram "A" + "X" -->
  <polygon points="50,16 78,78 64,78 50,46 36,78 22,78" fill="url(#goldGrad)" filter="url(#glow)"/>
  <polygon points="50,30 60,54 40,54" fill="#0A0A0C"/>
  <line x1="30" y1="62" x2="70" y2="62" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6"/>
</svg>